name: "Generate Repository Dashboard"
description: "A GitHub Action to generate an interactive repository dashboard using GraphQL."
author: "GitHub OSPO <ospo@github.com>"
inputs:
  GITHUB_TOKEN:
    description: "GitHub token with necessary scopes"
    required: true
  ORG_NAME:
    description: "The GitHub organization name"
    required: true
runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests tqdm loguru
    - name: Run Dashboard Generator
      run: python generate_table.py
